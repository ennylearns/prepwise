<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Prepwise - JAMB CBT Mock Exam</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-tertiary-container": "#ffd4c5",
                      "surface-container-highest": "#e2e1ed",
                      "on-surface-variant": "#434654",
                      "surface": "#faf8ff",
                      "on-tertiary-fixed-variant": "#802a00",
                      "error": "#ba1a1a",
                      "secondary": "#735c00",
                      "tertiary": "#852b00",
                      "tertiary-fixed-dim": "#ffb59a",
                      "outline": "#737686",
                      "secondary-fixed": "#ffe083",
                      "on-background": "#191b23",

                      "surface-container": "#ededf8",
                      "inverse-surface": "#2e3039",

                      "on-primary": "#ffffff",
                      "primary-fixed": "#dbe1ff",
                      "on-tertiary": "#ffffff",
                      "surface-container-low": "#f3f3fe",
                      "background": "#faf8ff",
                      "on-primary-container": "#d4dcff",
                      "on-error-container": "#93000a",
                      "secondary-fixed-dim": "#eec200",
                      "primary": "#003fb1",
                      "on-primary-fixed-variant": "#003dab",
                      "on-secondary-fixed": "#231b00",
                      "surface-container-lowest": "#ffffff",
                      "inverse-on-surface": "#f0f0fb",
                      "error-container": "#ffdad6",
                      "on-secondary-fixed-variant": "#574500",
                      "on-secondary": "#ffffff",
                      "surface-tint": "#1353d8",
                      "surface-bright": "#faf8ff",
                      "tertiary-fixed": "#ffdbcf",
                      "outline-variant": "#c3c5d7",
                      "on-secondary-container": "#6f5900",
                      "on-tertiary-fixed": "#380d00",
                      "on-primary-fixed": "#00174d",
                      "on-error": "#ffffff",
                      "tertiary-container": "#ad3b00",
                      "secondary-container": "#fed01b",
                      "surface-variant": "#e2e1ed",
                      "primary-container": "#1a56db",
                      "surface-container-high": "#e7e7f3",
                      "inverse-primary": "#b5c4ff",
                      "on-surface": "#191b23"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "lg": "24px",
                      "xl": "40px",
                      "base": "4px",
                      "container-margin": "16px",
                      "xs": "4px",
                      "sm": "8px",
                      "gutter": "12px",
                      "md": "16px"
              },
              "fontFamily": {
                      "h2": [
                              "Lexend"
                      ],
                      "button": [
                              "Inter"

                      "label-caps": [
                              "Inter"
                      ],
                      "body-md": [
                              "Inter"
                      ],
                      "display": [
                              "Lexend"
                      ],
                      "body-lg": [

                      "body-sm": [

                      "h1": [

                      ]
              },
              "fontSize": {
                      "h2": [
                              "20px",

                              {
                                      "lineHeight": "20px",

                      ],
                      "label-caps": [

                      "display": [

                      ],
                      "body-lg": [
                              "18px",

                                      "lineHeight": "28px",
                                      "fontWeight": "400"

                      ],
                      "body-sm": [
                              "14px",

                                      "lineHeight": "20px",
                                      "fontWeight": "400"
                              }
                      ],
                      "h1": [
                              "24px",
                              {
                                      "lineHeight": "32px",
                                      "letterSpacing": "-0.01em",
                                      "fontWeight": "600"

              }
      },
          },
        }
      </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased">
<!-- Top Navigation Area (Task Focused, so minimalist) -->
<header class="sticky top-0 w-full flex justify-between items-center px-md h-16 bg-surface-container-lowest border-b border-surface-variant z-50">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary text-xl">school</span>
<span class="font-display text-display text-primary tracking-tight">Prepwise</span>
</div>
<!-- Timer Widget -->
<div class="flex items-center gap-xs bg-surface-container px-sm py-xs rounded-lg border border-outline-variant">
<span class="material-symbols-outlined text-on-surface-variant text-base">timer</span>
<span class="font-button text-button text-on-surface tabular-nums">01:45:22</span>
</div>
<div class="flex items-center">
<button class="bg-error-container text-on-error-container font-button text-button px-md py-sm rounded-lg flex items-center gap-xs hover:opacity-90">
<span class="material-symbols-outlined text-[18px]">logout</span>
<span class="hidden md:inline">Submit Exam</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow container mx-auto px-container-margin py-lg grid grid-cols-1 lg:grid-cols-12 gap-lg max-w-7xl">
<!-- Question Panel (Left/Main) -->
<div class="lg:col-span-8 flex flex-col gap-md">
<!-- Subject Header & Progress Info -->
<div class="flex justify-between items-center pb-sm border-b border-surface-variant">
<div class="flex items-center gap-sm">
<span class="bg-primary-container text-on-primary-container font-label-caps text-label-caps px-sm py-xs rounded-full">PHYSICS</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Question 12 of 40</span>
</div>
<button class="flex items-center gap-xs text-secondary font-button text-button hover:bg-secondary-container px-sm py-xs rounded-md transition-colors">
<span class="material-symbols-outlined">flag</span>
<span>Flag for Review</span>
</button>
</div>
<!-- Question Card -->
<div class="bg-surface-container-lowest border border-surface-variant rounded-xl p-md md:p-lg shadow-[0_2px_4px_rgba(0,0,0,0.04)]">
<h2 class="font-h1 text-h1 text-on-surface mb-md">A projectile is fired with a velocity of 50 m/s at an angle of 30° to the horizontal. Calculate the time of flight. (Take g = 10 m/s²)</h2>
<!-- Options -->
<div class="flex flex-col gap-sm">
<!-- Option A -->
<label class="flex items-start gap-md p-md border-2 border-surface-variant rounded-lg cursor-pointer hover:border-primary-fixed-dim hover:bg-surface-container-low transition-colors">
<input class="mt-1 w-5 h-5 text-primary border-outline-variant focus:ring-primary focus:ring-offset-surface-container-lowest" name="question12" type="radio"/>
<div class="flex-1">
<span class="font-button text-button text-on-surface-variant mr-sm">A.</span>
<span class="font-body-lg text-body-lg text-on-surface">2.5 s</span>
</div>
</label>
<!-- Option B (Selected) -->
<label class="flex items-start gap-md p-md border-2 border-primary bg-primary-fixed rounded-lg cursor-pointer transition-colors shadow-[0_2px_8px_rgba(0,0,0,0.08)]">
<input checked="" class="mt-1 w-5 h-5 text-primary border-primary focus:ring-primary focus:ring-offset-primary-fixed" name="question12" type="radio"/>
<div class="flex-1">
<span class="font-button text-button text-primary mr-sm">B.</span>
<span class="font-body-lg text-body-lg text-on-surface">5.0 s</span>
</div>
</label>
<!-- Option C -->
<label class="flex items-start gap-md p-md border-2 border-surface-variant rounded-lg cursor-pointer hover:border-primary-fixed-dim hover:bg-surface-container-low transition-colors">
<input class="mt-1 w-5 h-5 text-primary border-outline-variant focus:ring-primary focus:ring-offset-surface-container-lowest" name="question12" type="radio"/>
<div class="flex-1">
<span class="font-button text-button text-on-surface-variant mr-sm">C.</span>
<span class="font-body-lg text-body-lg text-on-surface">10.0 s</span>
</div>
</label>
<!-- Option D -->
<label class="flex items-start gap-md p-md border-2 border-surface-variant rounded-lg cursor-pointer hover:border-primary-fixed-dim hover:bg-surface-container-low transition-colors">
<input class="mt-1 w-5 h-5 text-primary border-outline-variant focus:ring-primary focus:ring-offset-surface-container-lowest" name="question12" type="radio"/>
<div class="flex-1">
<span class="font-button text-button text-on-surface-variant mr-sm">D.</span>
<span class="font-body-lg text-body-lg text-on-surface">12.5 s</span>
</div>
</label>
</div>
</div>
<!-- Navigation Buttons -->
<div class="flex justify-between items-center mt-sm">
<button class="flex items-center gap-xs px-lg py-sm border border-outline text-on-surface font-button text-button rounded-full hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined">chevron_left</span>
                    Previous
                </button>
<button class="flex items-center gap-xs px-lg py-sm bg-primary text-on-primary font-button text-button rounded-full hover:opacity-90 transition-opacity shadow-[0_4px_12px_rgba(0,0,0,0.1)]">
                    Next
                    <span class="material-symbols-outlined">chevron_right</span>
</button>
</div>
</div>
<!-- Question Grid Panel (Right/Sidebar) -->
<div class="lg:col-span-4 flex flex-col gap-md">
<div class="bg-surface-container-lowest border border-surface-variant rounded-xl p-md shadow-[0_2px_4px_rgba(0,0,0,0.04)] h-full flex flex-col">
<h3 class="font-h2 text-h2 text-on-surface mb-sm">Question Navigation</h3>
<!-- Legend -->
<div class="flex flex-wrap gap-sm mb-md pb-sm border-b border-surface-variant text-body-sm font-body-sm text-on-surface-variant">
<div class="flex items-center gap-xs"><span class="w-3 h-3 rounded-full bg-surface-container border border-outline-variant"></span> Unanswered</div>
<div class="flex items-center gap-xs"><span class="w-3 h-3 rounded-full bg-primary"></span> Answered</div>
<div class="flex items-center gap-xs"><span class="w-3 h-3 rounded-full bg-secondary"></span> Flagged</div>
</div>
<!-- Subject Tabs (Mock) -->
<div class="flex gap-xs mb-md overflow-x-auto pb-xs">
<button class="px-sm py-xs bg-primary-container text-on-primary-container font-label-caps text-label-caps rounded-full whitespace-nowrap">PHYSICS</button>
<button class="px-sm py-xs border border-outline-variant text-on-surface-variant hover:bg-surface-container font-label-caps text-label-caps rounded-full whitespace-nowrap">CHEMISTRY</button>
<button class="px-sm py-xs border border-outline-variant text-on-surface-variant hover:bg-surface-container font-label-caps text-label-caps rounded-full whitespace-nowrap">MATHS</button>
<button class="px-sm py-xs border border-outline-variant text-on-surface-variant hover:bg-surface-container font-label-caps text-label-caps rounded-full whitespace-nowrap">ENGLISH</button>
</div>
<!-- Grid -->
<div class="grid grid-cols-5 sm:grid-cols-6 lg:grid-cols-5 gap-xs overflow-y-auto pr-xs custom-scrollbar">
<!-- Sample Generation -->
<!-- Answered -->
<button class="w-10 h-10 rounded-lg bg-primary text-on-primary font-button text-button flex items-center justify-center">1</button>
<button class="w-10 h-10 rounded-lg bg-primary text-on-primary font-button text-button flex items-center justify-center">2</button>
<button class="w-10 h-10 rounded-lg bg-primary text-on-primary font-button text-button flex items-center justify-center">3</button>
<!-- Flagged -->
<button class="w-10 h-10 rounded-lg bg-secondary text-on-secondary font-button text-button flex items-center justify-center relative">
                        4
                        <span class="absolute top-0 right-0 w-2 h-2 bg-error rounded-full translate-x-1/3 -translate-y-1/3"></span>
</button>
<button class="w-10 h-10 rounded-lg bg-primary text-on-primary font-button text-button flex items-center justify-center">5</button>
<button class="w-10 h-10 rounded-lg bg-primary text-on-primary font-button text-button flex items-center justify-center">6</button>
<button class="w-10 h-10 rounded-lg bg-primary text-on-primary font-button text-button flex items-center justify-center">7</button>
<!-- Unanswered -->
<button class="w-10 h-10 rounded-lg bg-surface-container border border-outline-variant text-on-surface-variant font-button text-button flex items-center justify-center hover:bg-surface-container-high transition-colors">8</button>
<button class="w-10 h-10 rounded-lg bg-surface-container border border-outline-variant text-on-surface-variant font-button text-button flex items-center justify-center hover:bg-surface-container-high transition-colors">9</button>
<button class="w-10 h-10 rounded-lg bg-surface-container border border-outline-variant text-on-surface-variant font-button text-button flex items-center justify-center hover:bg-surface-container-high transition-colors">10</button>
<button class="w-10 h-10 rounded-lg bg-surface-container border border-outline-variant text-on-surface-variant font-button text-button flex items-center justify-center hover:bg-surface-container-high transition-colors">11</button>
<!-- Current Active -->
<button class="w-10 h-10 rounded-lg bg-primary-fixed border-2 border-primary text-primary font-button text-button flex items-center justify-center shadow-[0_0_0_2px_rgba(26,86,219,0.2)]">12</button>
<button class="w-10 h-10 rounded-lg bg-surface-container border border-outline-variant text-on-surface-variant font-button text-button flex items-center justify-center hover:bg-surface-container-high transition-colors">13</button>
<button class="w-10 h-10 rounded-lg bg-surface-container border border-outline-variant text-on-surface-variant font-button text-button flex items-center justify-center hover:bg-surface-container-high transition-colors">14</button>
<button class="w-10 h-10 rounded-lg bg-surface-container border border-outline-variant text-on-surface-variant font-button text-button flex items-center justify-center hover:bg-surface-container-high transition-colors">15</button>
<!-- More generic generation to fill out a bit -->
<script>
                        for(let i=16; i<=40; i++) {
                            document.write(`<button class="w-10 h-10 rounded-lg bg-surface-container border border-outline-variant text-on-surface-variant font-button text-button flex items-center justify-center hover:bg-surface-container-high transition-colors">${i}</button>`);
                        }
                    </script>
</div>
</div>
</div>
</main>
</body></html>
