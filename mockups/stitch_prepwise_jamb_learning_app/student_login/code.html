<body class="bg-surface-container-lowest text-on-surface min-h-screen flex items-center justify-center p-container-margin font-sans antialiased">
<!-- Login Container -->
<main class="w-full max-w-md w-full bg-surface-container-lowest rounded-xl sm:shadow-[0_2px_4px_rgba(0,0,0,0.04)] sm:border sm:border-surface-variant sm:p-xl space-y-xl">
<!-- Header Section -->
<header class="text-center space-y-sm flex flex-col items-center">
<!-- Brand Logo Icon -->
<div class="h-16 w-16 bg-primary-container rounded-2xl flex items-center justify-center mb-sm text-primary">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">school</span>
</div>
<h1 class="font-display text-display text-primary tracking-tight">Prepwise</h1>
<h2 class="font-h1 text-h1 text-on-surface mt-xs">Welcome Back</h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] mx-auto">
                Sign in to continue your preparation and track your progress.
            </p>
</header>
<!-- Login Form -->
<form class="space-y-lg">
<!-- Email Field -->
<div class="space-y-xs">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="email">
                    Email Address
                </label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input class="block w-full h-[48px] pl-[44px] pr-md rounded-lg border border-outline bg-surface text-on-surface font-body-md focus:border-primary focus:ring-1 focus:ring-primary transition-colors outline-none" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="password">
                        Password
                    </label>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="block w-full h-[48px] pl-[44px] pr-[44px] rounded-lg border border-outline bg-surface text-on-surface font-body-md focus:border-primary focus:ring-1 focus:ring-primary transition-colors outline-none" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-md flex items-center text-outline hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Primary Action -->
<button class="w-full h-[48px] bg-primary text-on-primary font-button text-button rounded-full hover:bg-on-primary-fixed-variant transition-all duration-200 flex items-center justify-center shadow-[0_8px_16px_rgba(0,0,0,0.08)] active:scale-95 mt-lg" type="submit">
                Login
            </button>
</form>
<!-- Footer Actions -->
<footer class="text-center pt-md flex flex-col items-center space-y-md">
<p class="font-body-md text-body-md text-on-surface-variant">
                Don't have an account? 
                <a class="text-primary font-semibold hover:underline decoration-2 underline-offset-4" href="#">Create Account</a>
</p>
</footer>
</main>
